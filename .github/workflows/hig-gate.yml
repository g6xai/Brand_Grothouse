name: Apple HIG Gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The self-test runs inside the ratchet on every invocation, but running
      # it as its own step means a rule regression is reported as a rule
      # regression rather than as a mystery count change.
      - name: Rule self-test (known-bad must match, known-good must not)
        run: node scripts/hig-lint-ratchet.mjs --self-test

      - name: Ratchet — no section may grow
        run: node scripts/hig-lint-ratchet.mjs

      # kit/tokens.json is canonical. This fails if kit/tokens.js is stale or if
      # any of the CSS token values drifted from the JSON.
      - name: Token parity
        run: node scripts/build-tokens.mjs --check

      # Asserts every colour pair the kit actually renders against its required
      # ratio. Added after review caught a 4.18:1 primary button label that the
      # lint could not see: a raw hex is checkable by regex, an insufficient
      # contrast between two tokens is not.
      - name: Contrast
        run: node scripts/contrast.mjs

      # A file can reach zero violations by being broken. This checks what the
      # lint cannot see: dead links, unparseable JSON, an unusable tokens.js,
      # unbalanced CSS.
      - name: Assets and links
        run: node scripts/check-assets.mjs

      # Proves in CI what was proven by hand: a violation added to a real file
      # fails the gate. Without this, a silently-broken ratchet reports green
      # forever and nobody finds out until the migration has already rotted.
      - name: Prove the ratchet has teeth
        run: |
          cp kit/theme-toggle.css /tmp/tt.bak
          printf '\n.ci-sabotage { border-radius: 3px; }\n' >> kit/theme-toggle.css
          if node scripts/hig-lint-ratchet.mjs > /dev/null 2>&1; then
            cp /tmp/tt.bak kit/theme-toggle.css
            echo "::error::Ratchet passed with an injected violation — the gate is not enforcing."
            exit 1
          fi
          cp /tmp/tt.bak kit/theme-toggle.css
          echo "Gate correctly rejected an injected violation."

      # Same idea for the parity check: prove it can see drift.
      - name: Prove token parity has teeth
        run: |
          cp kit/grothouse-system.css /tmp/gs.bak
          sed -i 's/--radius-card: 16px;/--radius-card: 20px;/' kit/grothouse-system.css
          if node scripts/build-tokens.mjs --check > /dev/null 2>&1; then
            cp /tmp/gs.bak kit/grothouse-system.css
            echo "::error::Parity check passed with a drifted CSS value — it is not enforcing."
            exit 1
          fi
          cp /tmp/gs.bak kit/grothouse-system.css
          echo "Parity check correctly rejected a drifted value."

      # And for the contrast gate: collapsing the teal fill back into the
      # accent is the exact defect review found. It must fail.
      - name: Prove the contrast gate has teeth
        run: |
          cp scripts/contrast.mjs /tmp/ct.bak
          sed -i "s/fillLight: '#0B7A64'/fillLight: '#0E8C74'/" scripts/contrast.mjs
          if node scripts/contrast.mjs > /dev/null 2>&1; then
            cp /tmp/ct.bak scripts/contrast.mjs
            echo "::error::Contrast gate passed with a 4.18:1 button label — it is not enforcing."
            exit 1
          fi
          cp /tmp/ct.bak scripts/contrast.mjs
          echo "Contrast gate correctly rejected a sub-4.5:1 button label."

      - name: Report
        if: always()
        run: node scripts/hig-lint-ratchet.mjs --report || true
